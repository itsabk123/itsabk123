# Local development only. Everything is namespaced "majlis" and bound to 127.0.0.1 on unusual ports,
# so it won't touch other containers, databases or apps on your machine.
#
#   Database only (you run Node yourself):   docker compose up -d --wait
#   Database + app (no Node needed):         docker compose --profile app up
name: majlis
services:
  db:
    image: postgres:16-alpine
    container_name: majlis-db
    environment:
      POSTGRES_USER: majlis
      POSTGRES_PASSWORD: majlis_local
      POSTGRES_DB: majlis
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - majlis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majlis -d majlis"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    profiles: ["app"]
    image: node:22-bookworm
    container_name: majlis-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://majlis:majlis_local@db:5432/majlis
      APP_URL: http://localhost:3107
      APP_SECRET: local-dev-only-secret-change-me-please
      PAYMENT_PROVIDER: sandbox
      STORAGE_DIR: ./storage
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-admin-123
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install --no-audit --no-fund && npx prisma migrate deploy && npm run db:seed:demo && npx next dev -H 0.0.0.0 -p 3107"
    ports:
      - "127.0.0.1:3107:3107"
    volumes:
      - ./:/app
      - majlis_node_modules:/app/node_modules
      - majlis_next:/app/.next

volumes:
  majlis_pgdata:
  majlis_node_modules:
  majlis_next:
